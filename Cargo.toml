[package]
name = "origence"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "The Intelligence Foundation for AI Agents."
publish = false
autotests = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
futures = "0.3"
jieba-rs = "0.7"
lopdf = { version = "0.38", default-features = false }
pdf-extract = "0.10"
pulldown-cmark = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "0.8", features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "uuid", "chrono", "json", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
lancedb = { version = "=0.23.1", default-features = false, optional = true }
arrow-array = { version = "56.2", optional = true }
arrow-schema = { version = "56.2", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["local-storage"]
local-vector = ["dep:lancedb", "dep:arrow-array", "dep:arrow-schema"]
local-storage = ["local-vector"]

[profile.release]
lto = "thin"
strip = true

[[test]]
name = "local"
path = "tests/local.rs"

[[bin]]
name = "origence"
path = "src/main.rs"
required-features = ["local-storage"]
