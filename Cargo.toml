[package]
name = "origence"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
description = "The unified data foundation for AI agents."
publish = false
default-run = "origence"
autotests = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
anyseek = { git = "https://github.com/TheLudlows/anyseek.git", rev = "5626dadfd5414b294a3cf0f6b845f5261760f68b", default-features = false, optional = true }
clap = { version = "4", features = ["derive", "env"] }
fs2 = { version = "0.4", optional = true }
jieba-rs = "0.7"
# Text extraction only; no OCR, rendering, or platform bindings.
pdf_oxide = { version = "=0.3.78", default-features = false }
pulldown-cmark = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "=1.8.0", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.10"
rusqlite = { version = "=0.43.0", optional = true, default-features = false, features = ["bundled"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["local-storage"]
local-storage = ["sqlite", "dep:anyseek"]
sqlite = ["dep:rusqlite", "dep:fs2"]
# Historical fixture diagnostics are opt-in and are not production acceptance.
manual-diagnostics = ["sqlite"]

[profile.release]
lto = "thin"
strip = true

[[test]]
name = "local"
path = "tests/local.rs"
required-features = ["sqlite"]

[[test]]
name = "core"
path = "tests/core.rs"

[[test]]
name = "anyseek"
path = "tests/anyseek.rs"

[[test]]
name = "identity-layout"
path = "tests/manual/identity_layout_benchmark.rs"
required-features = ["manual-diagnostics"]

[[bin]]
name = "origence"
path = "src/main.rs"
required-features = ["local-storage"]

[[bin]]
name = "origence-skill"
path = "src/bin/origence-skill.rs"
required-features = ["local-storage"]

[[test]]
name = "skill-workflow"
path = "tests/skill_workflow.rs"
required-features = ["local-storage"]
