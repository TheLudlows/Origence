[package]
name = "origence"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
description = "The Intelligence Foundation for AI Agents."
publish = false
autotests = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
futures = "0.3"
jieba-rs = "0.7"
# Text extraction only; no OCR, rendering, or platform bindings.
pdf_oxide = { version = "=0.3.78", default-features = false }
pulldown-cmark = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "=1.8.0", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
turso = { version = "=0.8.2", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
lancedb = { version = "=0.40.0", default-features = false, features = ["remote"], optional = true }
# Read-only physical IVF partition verification; same version already used by LanceDB.
# Build the protobuf compiler from source inside Lance's own build scripts.
lance = { version = "=13.0.0", default-features = false, features = ["protoc"], optional = true }
# Lance 13 does not forward its protoc feature to this existing dependency.
lance-datafusion = { version = "=13.0.0", default-features = false, features = ["protoc"], optional = true }
# Same existing package node; exposes the patched writer for focused recovery tests.
lance-io = { version = "=13.0.0", default-features = false, optional = true }
arrow-array = { version = "=58.3.0", optional = true }
arrow-schema = { version = "=58.3.0", optional = true }

[dev-dependencies]
# Deterministic Pending cancellation coverage; production uses no VFS test feature.
turso = { version = "=0.8.2", default-features = false, features = ["io_memory_yield"] }
tempfile = "3"

[features]
default = ["local-storage"]
local-vector = ["dep:lancedb", "dep:lance", "dep:lance-datafusion", "dep:lance-io", "dep:arrow-array", "dep:arrow-schema"]
local-storage = ["local-vector"]
# Historical fixture diagnostics are opt-in and are not production acceptance.
manual-diagnostics = []

[profile.release]
lto = "thin"
strip = true

[[test]]
name = "local"
path = "tests/local.rs"

[[test]]
name = "identity-layout"
path = "tests/manual/identity_layout_benchmark.rs"
required-features = ["manual-diagnostics"]

[[bin]]
name = "origence"
path = "src/main.rs"
required-features = ["local-storage"]

[[example]]
name = "vector_layout_probe"
required-features = ["local-vector"]

[patch.crates-io]
# Exact 13.0.0 source with shutdown error propagation; see vendored provenance.
lance-io = { path = "vendor/lance-io" }
