[package]
name = "origence-turso-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.0"
publish = false

# This is a disposable compatibility harness, not an application dependency.
# Keep it outside Origence's dependency graph and root Cargo.lock.
[workspace]

[dev-dependencies]
# Turso Database v0.8.2, resolved annotated tag -> immutable commit.
turso = { git = "https://github.com/tursodatabase/turso", rev = "5c168be5ef6a32ac966daf5983502a4f694b37ad", default-features = false, features = ["fts"] }
tokio = { version = "1", features = ["macros", "rt"] }
tempfile = "3"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[[test]]
name = "contracts"
path = "tests/contracts.rs"
