x-local: &local
  image: opencontext:local
  build: .
  environment:
    OC_DATA_DIR: /data
    OC_ENABLE_MODELS: ${OC_ENABLE_MODELS:-false}
    OC_MODEL_BASE_URL: ${OC_MODEL_BASE_URL:-}
    OC_MODEL_API_KEY: ${OC_MODEL_API_KEY:-}
    OC_EMBEDDING_MODEL: ${OC_EMBEDDING_MODEL:-}
    OC_EMBEDDING_DIMENSION: ${OC_EMBEDDING_DIMENSION:-0}
    OC_EXTRACTION_MODEL: ${OC_EXTRACTION_MODEL:-}
  volumes:
    - data:/data
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  mem_limit: 2g
  pids_limit: 256

services:
  host:
    <<: *local
    command: [serve, --bind, "0.0.0.0:8080"]
    ports: ["127.0.0.1:${OC_HTTP_PORT:-8080}:8080"]
    stop_grace_period: 120s
    restart: unless-stopped
  admin:
    <<: *local
    profiles: [tools]
    # Offline commands require the host to be stopped first.
    command: [--help]

volumes:
  data:
