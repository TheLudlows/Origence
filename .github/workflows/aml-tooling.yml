name: AML refactor tooling (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  generate-cargo-artifacts:
    if: github.head_ref == 'refactor/aml-generic-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Let Cargo update only required feature dependencies
        run: |
          cargo metadata --format-version 1 > /tmp/cargo-metadata.json
          cargo fmt --all
          git diff --binary > /tmp/generated.patch
          sha256sum Cargo.lock /tmp/generated.patch
      - uses: actions/upload-artifact@v4
        with:
          name: aml-cargo-generated
          path: |
            Cargo.lock
            /tmp/generated.patch
          if-no-files-found: error
