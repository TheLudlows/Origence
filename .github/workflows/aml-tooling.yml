name: AML switch formatting (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  generate-format-artifact:
    if: github.head_ref == 'refactor/aml-api-switch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Format the exact proposed source without changing dependencies
        run: |
          cargo fmt --all
          git diff --binary > /tmp/generated.patch
          sha256sum Cargo.lock /tmp/generated.patch
      - uses: actions/upload-artifact@v4
        with:
          name: aml-switch-format-generated
          path: /tmp/generated.patch
          if-no-files-found: error
