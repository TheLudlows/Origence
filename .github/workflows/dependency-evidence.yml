name: Dependency remediation evidence
on:
  pull_request:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/dependency-evidence.yml
permissions:
  contents: read
jobs:
  resolve-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Validate the committed Cargo lock
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          mkdir -p evidence
          cp Cargo.lock evidence/Cargo.lock
          cargo fmt --all -- --check
          cp src/mcp.rs evidence/mcp.rs
          rustc --version > evidence/toolchain.txt
          cargo --version >> evidence/toolchain.txt
          sha256sum Cargo.lock > evidence/lock.sha256
      - name: Inspect active dependency features
        run: |
          set +e
          export CARGO_TERM_COLOR=never
          for package in rmcp rsa lru; do
            cargo tree --locked --target all -e features -i "$package" > "evidence/$package-default.txt" 2>&1
            echo "$?" > "evidence/$package-default-exit.txt"
            cargo tree --locked --target all --no-default-features -e features -i "$package" > "evidence/$package-no-default.txt" 2>&1
            echo "$?" > "evidence/$package-no-default-exit.txt"
          done
          exit 0
      - name: Install official RustSec audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Record a fresh audit without ignores
        run: |
          set +e
          cargo audit --json > evidence/audit.json
          status=$?
          printf '%s\n' "$status" > evidence/audit-exit-code.txt
          git -C "$HOME/.cargo/advisory-db" rev-parse HEAD > evidence/advisory-db-commit.txt
          exit 0
      - name: Preserve generated lock and unsuppressed audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-evidence
          path: evidence/
          if-no-files-found: error
