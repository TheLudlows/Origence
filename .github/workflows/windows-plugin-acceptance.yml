name: Windows plugin acceptance (synthetic)

on:
  workflow_dispatch:
  push:
    branches: [test/windows-plugin-acceptance]
  pull_request:
    paths:
      - '.github/workflows/windows-plugin-acceptance.yml'
      - 'bin/origence-setup*'
      - 'tools/install.mjs'
      - 'tools/installer/**'
      - 'tools/installer_smoke.py'

permissions:
  contents: read

concurrency:
  group: windows-plugin-acceptance-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  PYTHONUTF8: "1"

jobs:
  windows-installer-probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect isolated installer ACL failure
        shell: pwsh
        run: |
          @'
          import { spawnSync } from 'node:child_process';
          import { mkdtempSync, readFileSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          const target = mkdtempSync(join(tmpdir(), 'Origence ACL probe '));
          const script = `
          $ErrorActionPreference = 'Stop'
          $utf8 = [Text.UTF8Encoding]::new($false)
          $reader = [IO.StreamReader]::new([Console]::OpenStandardInput(), $utf8)
          $request = $reader.ReadToEnd() | ConvertFrom-Json
          ${readFileSync('tools/installer/windows.ps1', 'utf8')}`;
          const legacy = spawnSync('git', ['show', 'origin/main:tools/installer/windows.ps1'], { encoding: 'utf8' }).stdout;
          try {
            for (const [name, code] of [['legacy', legacy], ['pipe', script]]) {
              if (!code) continue;
              const args = ['-NoLogo', '-NoProfile', '-NonInteractive', '-EncodedCommand', Buffer.from(code, 'utf16le').toString('base64')];
              const result = spawnSync('powershell.exe', args, {
                input: JSON.stringify({ action: 'protect', path: target }), windowsHide: true, encoding: 'utf8', timeout: 20000
              });
              console.log(name, JSON.stringify({ status: result.status, error: result.error?.code, stderr: result.stderr, stdout: result.stdout }));
            }
          } finally { rmSync(target, { recursive: true, force: true }); }
          '@ | node --input-type=module
  windows-plugin:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v3-sqlite
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Origence for native Windows
        shell: pwsh
        run: ./tools/build.ps1 -Action Build -Jobs 2
      - name: Install pinned vendor CLI packages
        shell: pwsh
        run: |
          $clientDir = Join-Path $env:RUNNER_TEMP 'origence-plugin-clients'
          npm.cmd install --prefix $clientDir --ignore-scripts --no-audit --no-fund '@anthropic-ai/claude-code@2.1.330' '@openai/codex@0.171.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify HTTP plugins and the local installer on native Windows
        shell: pwsh
        run: |
          $clientDir = Join-Path $env:RUNNER_TEMP 'origence-plugin-clients/node_modules'
          $claude = (Get-ChildItem -Recurse -File (Join-Path $clientDir '@anthropic-ai/claude-code-win32-x64') -Filter 'claude.exe' |
            Select-Object -First 1).FullName
          $codex = (Get-ChildItem -Recurse -File (Join-Path $clientDir '@openai/codex-win32-x64') -Filter 'codex.exe' |
            Select-Object -First 1).FullName
          if (-not $claude -or -not $codex) { throw 'The pinned Windows native executables are missing.' }
          $env:CLAUDE_CODE_GIT_BASH_PATH = Join-Path $env:ProgramFiles 'Git/bin/bash.exe'
          $binary = (Resolve-Path './target/debug/origence.exe').Path
          [Environment]::OSVersion.VersionString
          git rev-parse HEAD
          Get-FileHash -Algorithm SHA256 -LiteralPath $binary, $claude, $codex | ForEach-Object {
            '{0} {1}' -f (Split-Path -Leaf $_.Path), $_.Hash.ToLowerInvariant()
          }
          python tools/plugin_smoke.py --binary $binary --claude $claude --codex $codex
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/plugin_smoke.py --binary $binary --claude $claude --codex $codex --bind '127.0.0.1:0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/installer_smoke.py --binary $binary --claude $claude --allow-windows-user-env
