name: Origence CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: local-storage-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  fast-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
          cache-on-failure: true
      - name: Check repository SQL has no joins or unresolved inputs
        run: python3 tools/check_no_join_sql.py
      - run: cargo fmt --all -- --check
      # Check the Turso authority layer before the full Lance vector backend.
      - name: Authority-only Clippy (without Lance)
        run: cargo clippy --locked --no-default-features --all-targets -j 2 -- -D warnings
      - name: Full test suite without default features
        run: cargo test --locked --no-default-features -j 2 --no-fail-fast
      - name: AML drill client tests (no external model calls)
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Python evaluation adapter tests
        run: python3 -m unittest discover -s evals -p 'test_*.py' -v
  identity-layout:
    if: github.head_ref == 'refactor/issue60-identity'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_PROFILE_RELEASE_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'pull_request' }}
          cache-on-failure: true
      - name: Build isolated release measurement
        timeout-minutes: 10
        run: |
          rustc --version --verbose | tee identity-layout-environment.txt
          cargo test --locked --release --no-default-features --test local -j 2 identity_layout_benchmark::identity_layout_before_after --no-run
      - name: Bounded native identity layout comparison
        timeout-minutes: 8
        run: |
          set -o pipefail
          timeout --kill-after=30s 7m cargo test --locked --release --no-default-features --test local -j 2 identity_layout_benchmark::identity_layout_before_after -- --ignored --exact --nocapture 2>&1 | tee identity-layout.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-layout-${{ github.sha }}
          path: identity-layout*.txt
          if-no-files-found: ignore
  linux-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # Override rust-toolchain.toml to test the exact declared MSRV.
      RUSTUP_TOOLCHAIN: 1.98.0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
          cache-on-failure: true
      - name: Linux native build tools
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
          protoc --proto_path=/usr/include --descriptor_set_out=/tmp/protobuf-check.pb google/protobuf/empty.proto
      - name: Confirm minimum Rust 1.98.0
        run: |
          rustc --version
          rustc --version | grep -Fq 'rustc 1.98.0 ('
      - name: Memory identity on minimum Rust without native features
        run: cargo test --locked --no-default-features --lib memory_identity -j 2
      # Keep link memory pressure bounded.
      - run: cargo clippy --locked --all-targets -j 2 -- -D warnings
      - name: Focused native storage, publication, and visibility contracts
        run: |
          # Integration modules share one executable (autotests = false).
          status=0
          cargo test --locked --lib -j 2 future_sizes -- --nocapture || status=1
          cargo test --locked --lib -j 2 storage::lancedb::ann::tests || status=1
          cargo test --locked --lib -j 2 final_native_validation_ || status=1
          cargo test --locked --lib -j 2 storage::native_turso::tests || status=1
          for filter in production_storage:: lancedb_native_search:: sqlite_ initialization:: storage_recovery:: semantic_memory:: semantic_capture:: session_feedback:: learning_loop:: evidence_bundle::; do
            cargo test --locked --test local -j 2 "$filter" || status=1
          done
          exit "$status"
      - run: cargo test --locked -j 2 --no-fail-fast
      - name: Debug build and no-model HTTP smoke
        run: |
          cargo build --locked -j 2
          python3 tools/smoke.py --binary target/debug/origence
      - name: MCP stdio local and host-forwarding contracts (no models)
        run: python3 tools/mcp_smoke.py --binary target/debug/origence
      - name: AML in-flight process recovery (controlled model fixture)
        env:
          AML_TEST_BINARY: target/debug/origence
        run: python3 -m unittest discover -s tools -p 'test_aml_recovery.py' -v
      # Evaluation evidence is run-specific, never part of the Cargo target cache.
      - name: Keyword retrieval seed evaluation (no model calls)
        run: python3 evals/run.py --binary target/debug/origence --commit "${{ github.sha }}" --output "$RUNNER_TEMP/origence-keyword-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Preserve synthetic retrieval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-linux
          path: ${{ runner.temp }}/origence-keyword-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: ignore
  windows:
    # Reuse normal Windows gates for the explicitly scoped cleanup/storage candidates.
    if: github.ref == 'refs/heads/main' || github.head_ref == 'refactor/issue61-cleanup' || github.head_ref == 'refactor/issue60-identity'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
          cache-on-failure: true
      - name: Build tools, lint, and all local lifecycle tests
        shell: pwsh
        run: ./tools/build.ps1 -Action Validate -Jobs 1
      - name: Authority contracts without Lance
        run: cargo check --locked --no-default-features --lib -j 1

