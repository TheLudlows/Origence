name: Origence CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: local-storage-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
jobs:
  node-ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: node-ui-dist
          path: ui/dist/
          if-no-files-found: error
          retention-days: 1
  fast-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
          cache-on-failure: true
      # Check all Origence targets with the declared formatter.
      - run: cargo fmt --all -- --check
      - name: Core without a metadata engine
        run: |
          cargo clippy --locked --no-default-features --all-targets -j 2 -- -D warnings
          cargo test --locked --no-default-features -j 2 --no-fail-fast
          cargo tree --locked --no-default-features --edges normal,build --prefix none > /tmp/core-dependencies.txt
          if grep -Eq '^(rusqlite|libsqlite3-sys|fs2) v' /tmp/core-dependencies.txt; then
            cat /tmp/core-dependencies.txt
            exit 1
          fi
      # Check SQLite authority independently of the complete host.
      - name: Authority-only Clippy
        run: cargo clippy --locked --no-default-features --features sqlite --all-targets -j 2 -- -D warnings
      - name: Confirm every feature set excludes retired storage engines
        run: |
          cargo tree --locked --all-features --edges normal,build --prefix none > /tmp/authority-dependencies.txt
          if grep -Eq '^(turso(-[^ ]+|_[^ ]+)?|libsql(-[^ ]+|_[^ ]+)?|limbo(-[^ ]+|_[^ ]+)?|lance(-[^ ]+)?|lancedb|protobuf-src) v' /tmp/authority-dependencies.txt; then
            cat /tmp/authority-dependencies.txt
            exit 1
          fi
      - name: Full SQLite authority test suite without host features
        run: cargo test --locked --no-default-features --features sqlite -j 2 --no-fail-fast
      - name: Python tooling tests (no external model calls)
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Python evaluation adapter tests
        run: |
          python3 -m unittest discover -s evals -p 'test_*.py' -v
          python3 -m unittest discover -s evals/pilot -p 'test_*.py' -v
  linux-native:
    needs: node-ui
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # Override rust-toolchain.toml to test the exact declared MSRV.
      RUSTUP_TOOLCHAIN: 1.98.0
      ANYSEEK_FIXTURE_REF: 6a46fc791c9c425e0f94fea3d04be4c1fb84dc3a
      ANYSEEK_FIXTURE_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
          cache-on-failure: true
      # Ubuntu 24.04 includes make/g++; no-default-features is covered in fast-check.
      - run: cargo clippy --locked --all-targets -j 2 -- -D warnings
      - name: Default-feature tests and smoke binary
        run: |
          cargo test --locked -j 2 --no-fail-fast
          # The integration tests build the CLI that the smoke steps reuse.
          test -x target/debug/origence
      - name: Fetch the pinned real AnySeek fixture
        uses: actions/checkout@v4
        with:
          repository: TheLudlows/anyseek
          ref: ${{ env.ANYSEEK_FIXTURE_REF }}
          path: .anyseek-fixture
          sparse-checkout: |
            anyseek
            .cargo
      - name: Cache pinned AnySeek fixture binary
        id: anyseek-cache
        uses: actions/cache@v4
        with:
          path: .anyseek-fixture/target/debug/anyseek_server
          key: anyseek-ubuntu24-${{ runner.os }}-${{ runner.arch }}-${{ env.ANYSEEK_FIXTURE_REF }}-${{ env.ANYSEEK_FIXTURE_TOOLCHAIN }}-dev0-v1
      - name: Install the external AnySeek fixture toolchain
        if: steps.anyseek-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.ANYSEEK_FIXTURE_TOOLCHAIN }}
      - name: Build the real AnySeek service
        if: steps.anyseek-cache.outputs.cache-hit != 'true'
        env:
          RUSTUP_TOOLCHAIN: ${{ env.ANYSEEK_FIXTURE_TOOLCHAIN }}
        run: cargo build --locked --manifest-path .anyseek-fixture/Cargo.toml --no-default-features --bin anyseek_server -j 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: node-ui-dist
          path: ui/dist/
      - name: No-model HTTP smoke against a fresh AnySeek fixture
        run: python3 tools/anyseek_smoke.py --anyseek-binary .anyseek-fixture/target/debug/anyseek_server --run python3 tools/smoke.py --binary target/debug/origence
      - name: MCP stdio local and host-forwarding contracts (no models)
        run: python3 tools/anyseek_smoke.py --anyseek-binary .anyseek-fixture/target/debug/anyseek_server --run python3 tools/mcp_smoke.py --binary target/debug/origence
      - name: Node UI to Origence API contracts (no models)
        run: python3 tools/anyseek_smoke.py --anyseek-binary .anyseek-fixture/target/debug/anyseek_server --run python3 tools/ui_smoke.py --binary target/debug/origence --ui-entry ui/dist/server.js
      - name: AnySeek public library, HTTP and MCP contracts (no models)
        run: python3 tools/anyseek_smoke.py --anyseek-binary .anyseek-fixture/target/debug/anyseek_server --cargo-tests --binary target/debug/origence
      # Evaluation evidence is run-specific, never part of the Cargo target cache.
      - name: Keyword retrieval seed evaluation (no model calls)
        run: python3 tools/anyseek_smoke.py --anyseek-binary .anyseek-fixture/target/debug/anyseek_server --run python3 evals/run.py --binary target/debug/origence --commit "${{ github.sha }}" --output "$RUNNER_TEMP/origence-keyword-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Preserve synthetic retrieval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-linux
          path: ${{ runner.temp }}/origence-keyword-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: ignore
  windows:
    # SQLite replacement must verify native locking and recovery on both OSes.
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v3-sqlite
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
          cache-on-failure: true
      - name: Build tools, lint, and all local lifecycle tests
        shell: pwsh
        run: ./tools/build.ps1 -Action Validate -Jobs 1 -SkipFormatCheck
      - name: Authority contracts without host features
        run: cargo check --locked --no-default-features --features sqlite --lib -j 1

