name: Origence CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: local-storage-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  fast-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
          cache-on-failure: true
      # Check all Origence targets with the declared formatter.
      - run: cargo fmt --package origence -- --check
      # Check the Turso authority layer independently of host features.
      - name: Authority-only Clippy
        run: cargo clippy --locked --no-default-features --all-targets -j 2 -- -D warnings
      - name: Confirm every feature set excludes the retired Lance backend
        run: |
          cargo tree --locked --all-features --edges normal,build --prefix none > /tmp/authority-dependencies.txt
          if grep -Eq '^(lance(-[^ ]+)?|lancedb|protobuf-src) v' /tmp/authority-dependencies.txt; then
            cat /tmp/authority-dependencies.txt
            exit 1
          fi
      - name: Full test suite without default features
        run: cargo test --locked --no-default-features -j 2 --no-fail-fast
      - name: Python tooling tests (no external model calls)
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Python evaluation adapter tests
        run: python3 -m unittest discover -s evals -p 'test_*.py' -v
  linux-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # Override rust-toolchain.toml to test the exact declared MSRV.
      RUSTUP_TOOLCHAIN: 1.98.0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
          cache-on-failure: true
      - name: Linux native build tools
        run: |
          sudo apt-get update && sudo apt-get install -y make g++
      - name: Confirm minimum Rust 1.98.0
        run: |
          rustc --version
          rustc --version | grep -Fq 'rustc 1.98.0 ('
      - name: Memory identity on minimum Rust without native features
        run: cargo test --locked --no-default-features --lib memory_identity -j 2
      # Keep link memory pressure bounded.
      - run: cargo clippy --locked --all-targets -j 2 -- -D warnings
      # One complete default-feature run includes the former focused filters.
      - run: cargo test --locked -j 2 --no-fail-fast
      - name: Debug build
        run: cargo build --locked -j 2
      - name: Fetch the pinned real AnySeek fixture
        uses: actions/checkout@v4
        with:
          repository: TheLudlows/anyseek
          ref: d813b915b7f12e7139ca316adc15699688493196
          path: .anyseek-fixture
          sparse-checkout: |
            anyseek
            .cargo
      - name: Install the external AnySeek fixture toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Build the real AnySeek service
        env:
          RUSTUP_TOOLCHAIN: 1.99.1
        run: cargo build --locked --manifest-path .anyseek-fixture/Cargo.toml --no-default-features --bin anyseek_server -j 2
      - name: No-model HTTP smoke against a fresh AnySeek fixture
        run: python3 tools/anyseek_smoke.py --anyseek-binary .anyseek-fixture/target/debug/anyseek_server --run python3 tools/smoke.py --binary target/debug/origence
      - name: MCP stdio local and host-forwarding contracts (no models)
        run: python3 tools/anyseek_smoke.py --anyseek-binary .anyseek-fixture/target/debug/anyseek_server --run python3 tools/mcp_smoke.py --binary target/debug/origence
      - name: AnySeek public library, HTTP and MCP contracts (no models)
        run: python3 tools/anyseek_smoke.py --anyseek-binary .anyseek-fixture/target/debug/anyseek_server --cargo-tests --binary target/debug/origence
      # Evaluation evidence is run-specific, never part of the Cargo target cache.
      - name: Keyword retrieval seed evaluation (no model calls)
        run: python3 tools/anyseek_smoke.py --anyseek-binary .anyseek-fixture/target/debug/anyseek_server --run python3 evals/run.py --binary target/debug/origence --commit "${{ github.sha }}" --output "$RUNNER_TEMP/origence-keyword-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Preserve synthetic retrieval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-linux
          path: ${{ runner.temp }}/origence-keyword-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: ignore
  windows:
    # Keep the established main-only Windows policy.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Do not restore the retired native backend dependency cache.
          prefix-key: v2-anyseek
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
          cache-on-failure: true
      - name: Build tools, lint, and all local lifecycle tests
        shell: pwsh
        run: ./tools/build.ps1 -Action Validate -Jobs 1
      - name: Authority contracts without host features
        run: cargo check --locked --no-default-features --lib -j 1

