name: Origence CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: local-storage-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  fast-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      # Catch source-level Clippy warnings before the expensive native engines.
      - name: Lightweight Clippy (no native backends)
        run: cargo clippy --locked --no-default-features --all-targets -j 2 -- -D warnings
      - run: cargo test --locked --no-default-features --lib -j 2
      - run: cargo test --locked --no-default-features --test local -j 2
      - name: Python evaluation adapter tests
        run: python3 -m unittest discover -s evals -p 'test_*.py' -v
  linux-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # Override rust-toolchain.toml to test the exact declared MSRV.
      RUSTUP_TOOLCHAIN: 1.98.0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux native build tools
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
          protoc --proto_path=/usr/include --descriptor_set_out=/tmp/protobuf-check.pb google/protobuf/empty.proto
      - name: Confirm minimum Rust 1.98.0
        run: |
          rustc --version
          rustc --version | grep -Fq 'rustc 1.98.0 ('
      - name: Memory identity on minimum Rust without native features
        run: cargo test --locked --no-default-features --lib memory_identity -j 2
      # Keep link memory pressure bounded.
      - run: cargo clippy --locked --all-targets -j 2 -- -D warnings
      - run: cargo test --locked -j 2 --no-fail-fast
      - name: Debug build and no-model HTTP smoke
        run: |
          cargo build --locked -j 2
          python3 tools/smoke.py --binary target/debug/origence
      # Evaluation evidence is run-specific, never part of the Cargo target cache.
      - name: Keyword retrieval seed evaluation (no model calls)
        run: python3 evals/run.py --binary target/debug/origence --commit "${{ github.sha }}" --output "$RUNNER_TEMP/origence-keyword-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Preserve synthetic retrieval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-linux
          path: ${{ runner.temp }}/origence-keyword-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: ignore
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build tools, lint, and all local lifecycle tests
        shell: pwsh
        run: ./tools/build.ps1 -Action Validate -Jobs 1
      - name: Storage contracts without native backends
        run: cargo check --locked --no-default-features --lib -j 1
  macos:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-14
    timeout-minutes: 180
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: macOS native build tools
        run: brew install protobuf
      - run: cargo clippy --locked --all-targets -j 2 -- -D warnings
      - run: cargo test --locked -j 2 --no-fail-fast
      - name: Release build and no-model HTTP smoke
        run: |
          cargo build --release --locked -j 2
          python3 tools/smoke.py --binary target/release/origence
      # Use the same run-scoped evidence policy as Linux; retain overwrite protection.
      - name: Keyword retrieval seed evaluation (no model calls)
        run: python3 evals/run.py --binary target/release/origence --commit "${{ github.sha }}" --output "$RUNNER_TEMP/origence-keyword-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Preserve synthetic retrieval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-macos
          path: ${{ runner.temp }}/origence-keyword-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: ignore
  container:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - name: Container release build
        run: docker build --build-arg BUILD_JOBS=3 -t origence:ci .
      - name: Container no-model HTTP smoke
        run: python3 tools/smoke.py --image origence:ci
