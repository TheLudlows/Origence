name: Local storage
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Build tools, lint, and all local lifecycle tests
        shell: pwsh
        run: ./tools/build.ps1 -Action Validate -Jobs 1
      - name: Storage contracts without native backends
        run: cargo check --locked --no-default-features --lib -j 1
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Linux native build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build protobuf-compiler
      - name: macOS native build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja protobuf
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -j 1 -- -D warnings
      - run: cargo test --locked -j 1 --no-fail-fast
      - name: Release build and no-model HTTP smoke
        run: |
          cargo build --release --locked -j 1
          python3 tools/smoke.py --binary target/release/opencontext
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build protobuf-compiler
      - name: Declared MSRV with default native backends
        run: cargo check --locked --all-targets -j 1
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build --build-arg BUILD_JOBS=2 -t opencontext:ci .
      - name: Container no-model HTTP smoke
        run: python3 tools/smoke.py --image opencontext:ci
