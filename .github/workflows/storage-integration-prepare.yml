name: Storage integration preparation
on:
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/storage-integration-prepare.yml'
permissions:
  contents: read
concurrency:
  group: storage-integration-prepare-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Update only required locked dependencies
        run: |
          cargo update -p lancedb --precise 0.40.0
          # Retain the tested native engine family, not just its SDK facade.
          for package in turso_sync_sdk_kit turso_sync_engine turso_sdk_kit turso_core turso_parser turso_ext turso_macros turso_sdk_kit_macros; do
            cargo update -p "$package" --precise 0.8.2
          done
          cargo update -p office_oxide --precise 0.1.9
      - uses: Swatinem/rust-cache@v2
        with:
          key: turso-lance-production
          save-if: true
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - name: Record generated lock and format diff
        run: |
          mkdir -p "$RUNNER_TEMP/prepared"
          cp Cargo.lock "$RUNNER_TEMP/prepared/Cargo.lock"
          git rev-parse HEAD > "$RUNNER_TEMP/prepared/head.txt"
          cargo fmt --all
          git diff -- src tests examples > "$RUNNER_TEMP/prepared/rustfmt.patch"
          cargo tree --locked -e features > "$RUNNER_TEMP/prepared/features.txt"
      - name: Compile exact proposed source (diagnostic, not final acceptance)
        run: cargo check --locked --all-targets -j 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-integration-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared
