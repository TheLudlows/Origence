name: Storage integration preparation
on:
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/storage-integration-prepare.yml'
permissions:
  contents: read
concurrency:
  group: storage-integration-prepare-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Record the existing Lance dependency as an explicit root dependency
        run: |
          cp Cargo.lock "$RUNNER_TEMP/before.lock"
          cargo metadata --format-version 1 > /dev/null
          python3 - <<'PYLOCK'
          import os, pathlib, tomllib
          before = tomllib.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'before.lock').read_text())
          after = tomllib.loads(pathlib.Path('Cargo.lock').read_text())
          dependencies = lambda lock: [p for p in lock['package'] if p['name'] != 'origence']
          assert dependencies(before) == dependencies(after), 'unexpected dependency package drift'
          root = lambda lock: next(p for p in lock['package'] if p['name'] == 'origence')
          expected = dict(root(before))
          expected['dependencies'] = sorted(set(expected['dependencies']) | {'lance'})
          assert expected == root(after), 'unexpected root dependency change'
          PYLOCK
      - uses: Swatinem/rust-cache@v2
        with:
          key: turso-lance-production
          save-if: true
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - name: Record generated lock and format diff
        run: |
          mkdir -p "$RUNNER_TEMP/prepared"
          cp Cargo.lock "$RUNNER_TEMP/prepared/Cargo.lock"
          git rev-parse HEAD > "$RUNNER_TEMP/prepared/head.txt"
          cargo fmt --all
          git diff -- src tests examples > "$RUNNER_TEMP/prepared/rustfmt.patch"
          cargo tree --locked -e features > "$RUNNER_TEMP/prepared/features.txt"
      - name: Compile exact proposed source (diagnostic, not final acceptance)
        run: cargo check --locked --all-targets -j 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-integration-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared
