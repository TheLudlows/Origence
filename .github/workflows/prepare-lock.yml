name: Temporary lockfile preparation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  prepare-lock:
    # Temporary evidence generation only; normal locked CI remains mandatory.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - name: Resolve only newly required packages
        run: |
          mkdir -p "$RUNNER_TEMP/lock-evidence"
          {
            git rev-parse HEAD
            rustc --version --verbose
            cargo --version
          } > "$RUNNER_TEMP/lock-evidence/environment.txt"
          cargo update --workspace
          cp Cargo.lock "$RUNNER_TEMP/lock-evidence/Cargo.lock"
          git diff -- Cargo.lock > "$RUNNER_TEMP/lock-evidence/Cargo.lock.diff"
          sha256sum Cargo.lock > "$RUNNER_TEMP/lock-evidence/Cargo.lock.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-lockfile-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/lock-evidence/
          if-no-files-found: error
